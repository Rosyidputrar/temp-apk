name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Dibutuhkan untuk membuat tag & release (token bawaan bisa read-only).
permissions:
  contents: write

# Build baru di branch/PR yang sama membatalkan build lama yang masih jalan.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Cek kode (analyze + test)
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Siapkan keystore dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secret keystore tidak ada — APK ditandatangani kunci debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/tempmail-release.keystore
          cat > android/key.properties <<EOF
          storeFile=tempmail-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=tempmail
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build APK (token dari Secrets, bukan dari kode)
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "::warning::Secret API_TOKEN kosong — aplikasi tidak bisa memanggil server."
          fi
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE=https://rest-tempmail.rosdiyttaa.workers.dev \
            --dart-define=API_TOKEN="$API_TOKEN" \
            --dart-define=APP_BUILD=${{ github.run_number }} \
            --dart-define=UPDATE_REPO=${{ github.repository }} \
            --build-number=${{ github.run_number }}

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: tempmail-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      # Release hanya untuk push ke main (bukan PR / jalankan manual di branch lain).
      - name: Terbitkan release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          # Semua APK per ABI: pembaruan di aplikasi memilih yang cocok dengan HP.
          files: build/app/outputs/flutter-apk/app-*-release.apk
