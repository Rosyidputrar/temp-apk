name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Siapkan keystore dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/tempmail-release.keystore
          cat > android/key.properties <<EOF
          storeFile=tempmail-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=tempmail
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build APK (token dari Secrets, bukan dari kode)
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE=https://rest-tempmail.rosdiyttaa.workers.dev \
            --dart-define=API_TOKEN="$API_TOKEN" \
            --build-number=${{ github.run_number }}

      - name: Terbitkan release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
permissions:
  contents: write